instance:
  exchange_id: "SHFE"
  account_id: "SIM001"

feed:
  type: sim

gateway:
  type: sim

sim:
  profile: fast
  scenario: vol_spike
  random_seed: 42
  strikes_per_side: 4
  expiry_count: 2
  top_level_volume: 24
  au_reference_price: 580.0
  ag_reference_price: 7800.0

pricing:
  risk_free_rate: 0.02
  vol_surface:
    method: orcWing
    fit_interval_seconds: 10

risk:
  hard:
    max_volume_per_order: 50
  soft:
    max_net_position: 200
    max_delta: 5000.0
    max_gamma: 2500.0
    max_vega: 50000.0

products:
  - underlying_id: "au2406"
    exchange_id: "SHFE"
    strategy_core: 4
    strategy_type: simple_mm
    params:
      bid_spread: 0.4
      ask_spread: 0.4
      quote_volume: 5
      product_delta_threshold: 25.0
      min_quote_interval_ms: 100.0
      max_position: 80
      enabled: true

  - underlying_id: "ag2406"
    exchange_id: "SHFE"
    strategy_core: 5
    strategy_type: simple_mm
    params:
      bid_spread: 6.0
      ask_spread: 6.0
      quote_volume: 3
      product_delta_threshold: 40.0
      min_quote_interval_ms: 100.0
      max_position: 50
      enabled: true

timer:
  hedge_check_interval_ms: 1000
  quote_refresh_interval_ms: 500

exchange_calendars:
  - exchange_id: "SHFE"
    ranges:
      - start: 20260420
        end: 20261231
        trading: true

exchange_trading_times:
  - exchange_id: "SHFE"
    sessions:
      - start_day_offset: -1
        start: "21:00:00"
        end_day_offset: 0
        end: "02:00:00"
      - start_day_offset: 0
        start: "09:00:00"
        end_day_offset: 0
        end: "10:15:00"
      - start_day_offset: 0
        start: "10:30:00"
        end_day_offset: 0
        end: "11:30:00"
      - start_day_offset: 0
        start: "13:00:00"
        end_day_offset: 0
        end: "15:00:00"

monitoring:
  grpc_listen_addr: "0.0.0.0:50051"

thread_affinity:
  feed_core: 2
  pricer_core: 3
  gateway_dispatcher_core: 12
  vol_fitter_core: 13
  risk_monitor_core: 14
  timer_core: 14
  grpc_server_core: 15
