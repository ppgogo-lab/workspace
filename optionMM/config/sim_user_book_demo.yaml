instance:
  exchange_id: "SHFE"
  account_id: "SIMBOOK001"

feed:
  type: sim

gateway:
  type: sim

sim:
  profile: calm
  scenario: normal
  random_seed: 42
  tick_interval_ms: 150
  strikes_per_side: 4
  expiry_count: 2
  future_wave_bps: 9.0
  future_noise_bps: 1.8
  option_spread_bps: 24.0
  top_level_volume: 20
  au_reference_price: 580.0
  ag_reference_price: 7800.0
  gateway_ack_latency_ms: 30
  gateway_cancel_latency_ms: 40
  gateway_fill_interval_ms: 180
  gateway_order_fill_probability: 0.30
  gateway_quote_cross_fill_probability: 0.10
  gateway_quote_passive_fill_probability: 0.02
  gateway_partial_fill_probability: 0.75
  gateway_reject_probability: 0.005
  gateway_max_fill_size: 1
  gateway_slippage_ticks: 0
  gateway_quote_near_touch_ticks: 0.3

pricing:
  risk_free_rate: 0.02
  vol_surface:
    method: orcWing
    fit_interval_seconds: 10

risk:
  hard:
    max_volume_per_order: 50
  soft:
    max_net_position: 200
    max_delta: 5000.0
    max_gamma: 2500.0
    max_vega: 50000.0

books:
  - book_id: 101
    book_code: "MM_AU2406"
    display_name: "AU2406 MM"
    active: true
    description: "Sim market making book for AU2406"
  - book_id: 201
    book_code: "MM_AG2406"
    display_name: "AG2406 MM"
    active: true
    description: "Sim market making book for AG2406"
  - book_id: 900
    book_code: "MANUAL_DEFAULT"
    display_name: "Manual Default"
    active: true
    description: "Default manual trading book"

users:
  - user_id: 1
    username: "admin"
    display_name: "Admin"
    password: "change_me"
    active: true
    default_book_id: 900

products:
  - underlying_id: "au2406"
    exchange_id: "SHFE"
    strategy_core: 4
    strategy_type: option_mm_core
    book_id: 101
    params:
      bid_spread: 0.4
      ask_spread: 0.4
      quote_volume: 5
      product_delta_threshold: 25.0
      min_quote_interval_ms: 100.0
      warning_position: 50
      max_position: 80
      base_half_spread_ticks: 1.0
      min_half_spread_ticks: 1.0
      max_half_spread_ticks: 6.0
      inventory_skew_per_lot_ticks: 0.02
      follow_weight: 0.35
      requote_price_epsilon_ticks: 1.0
      market_width_widen_threshold_ticks: 4.0
      underlying_move_widen_threshold_ticks: 2.0
      use_one_sided_at_limits: true
      enabled: true

  - underlying_id: "ag2406"
    exchange_id: "SHFE"
    strategy_core: 5
    strategy_type: option_mm_core
    book_id: 201
    params:
      bid_spread: 6.0
      ask_spread: 6.0
      quote_volume: 3
      product_delta_threshold: 40.0
      min_quote_interval_ms: 100.0
      warning_position: 30
      max_position: 50
      base_half_spread_ticks: 1.0
      min_half_spread_ticks: 1.0
      max_half_spread_ticks: 8.0
      inventory_skew_per_lot_ticks: 0.02
      follow_weight: 0.35
      requote_price_epsilon_ticks: 1.0
      market_width_widen_threshold_ticks: 6.0
      underlying_move_widen_threshold_ticks: 2.0
      use_one_sided_at_limits: true
      enabled: true

timer:
  hedge_check_interval_ms: 1000
  quote_refresh_interval_ms: 500

exchange_calendars:
  - exchange_id: "SHFE"
    ranges:
      - start: 20260420
        end: 20261231
        trading: true

exchange_trading_times:
  - exchange_id: "SHFE"
    sessions:
      - start_day_offset: -1
        start: "21:00:00"
        end_day_offset: 0
        end: "02:00:00"
      - start_day_offset: 0
        start: "09:00:00"
        end_day_offset: 0
        end: "10:15:00"
      - start_day_offset: 0
        start: "10:30:00"
        end_day_offset: 0
        end: "11:30:00"
      - start_day_offset: 0
        start: "13:00:00"
        end_day_offset: 0
        end: "15:00:00"

monitoring:
  grpc_listen_addr: "0.0.0.0:50061"
  hot_path_publish_mode: deferred

persistence:
  enabled: true
  data_path: "data/sim_user_book_demo.sqlite"
  batch_max_rows: 256
  flush_interval_ms: 10
  snapshot_interval_ms: 1000
  busy_timeout_ms: 1000

thread_affinity:
  feed_core: 2
  pricer_core: 3
  gateway_dispatcher_core: 12
  vol_fitter_core: 13
  risk_monitor_core: 14
  timer_core: 14
  grpc_server_core: 15
