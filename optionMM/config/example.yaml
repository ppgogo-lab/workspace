instance:
  exchange_id: "SHFE"
  account_id: "TEST001"

feed:
  type: multicast
  multicast:
    interface: "eth0"
    groups:
      - "239.1.2.3"
    port: 9001
    rcvbuf_mb: 8
  fpga:
    device: "/dev/fpga0"
  femas:
    front_addr: "tcp://127.0.0.1:17002"
    broker_id: ""
    user_id: ""
    password: ""
    exchange_id: "CFFEX"
    topic_id: 100
    heartbeat_timeout_sec: 30

gateway:
  type: ctp
  ctp:
    front_addr: "tcp://180.168.146.187:10201"   # CTP SimNow address
    broker_id: "9999"
    user_id: "your_user_id"
    password: "your_password"
    app_id: "simnow_client_test"
    auth_code: "0000000000000000"
  femas:
    front_addr: "tcp://127.0.0.1:10901"
    broker_id: ""
    user_id: ""
    password: ""

pricing:
  risk_free_rate: 0.025
  vol_surface:
    method: svi
    fit_interval_seconds: 60
  sabr_beta: 1.0

risk:
  hard:
    max_volume_per_order: 100
  soft:
    max_net_position: 500
    max_delta: 1000.0
    max_gamma: 500.0
    max_vega: 10000.0

products:
  - underlying_id: "cu2501"
    exchange_id: "SHFE"
    strategy_core: 4
    strategy_type: simple_mm
    params:
      bid_spread: 10.0        # RMB per tonne (copper option tick is 10)
      ask_spread: 10.0
      quote_volume: 5
      hedge_delta_threshold: 50.0
      min_quote_interval_ms: 100.0
      max_position: 100
      enabled: true

  - underlying_id: "rb2501"
    exchange_id: "SHFE"
    strategy_core: 5
    strategy_type: simple_mm
    params:
      bid_spread: 2.0         # RMB per tonne (rebar option tick is 1)
      ask_spread: 2.0
      quote_volume: 10
      hedge_delta_threshold: 100.0
      min_quote_interval_ms: 100.0
      max_position: 200
      enabled: true

monitoring:
  grpc_listen_addr: "0.0.0.0:50051"

thread_affinity:
  feed_core: 2
  pricer_core: 3
  gateway_dispatcher_core: 12
  vol_fitter_core: 13
  risk_monitor_core: 14
  timer_core: 14
  grpc_server_core: 15

timer:
  hedge_check_interval_ms: 1000
  quote_refresh_interval_ms: 500
