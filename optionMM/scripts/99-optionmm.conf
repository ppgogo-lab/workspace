# /etc/sysctl.d/99-optionmm.conf
# OptionMM HFT system tuning — persistent across reboots
# Install: sudo cp scripts/99-optionmm.conf /etc/sysctl.d/
#          sudo sysctl --system

# Disable NUMA page migration (prevents OS from moving pages between NUMA nodes)
kernel.numa_balancing         = 0

# Allow RT threads to run without time limit on isolated cores
# Default 950000 (95% CPU for RT) is too restrictive for pinned HFT threads
kernel.sched_rt_runtime_us    = -1

# Disable ASLR for deterministic memory layout
kernel.randomize_va_space     = 0

# Disable swap — any swap activity causes multi-ms stalls
vm.swappiness                 = 0

# Pre-allocate 2 MB huge pages (512 x 2 MB = 1 GB)
# Additional 1 GB huge pages must be set at boot via GRUB (hugepagesz=1G hugepages=4)
vm.nr_hugepages               = 512

# Network socket buffers — 128 MB max for high-throughput market data
net.core.rmem_max             = 134217728
net.core.wmem_max             = 134217728
net.core.rmem_default         = 16777216
net.core.wmem_default         = 16777216

# Busy-poll: spin for 50 μs before blocking on socket receive
# Reduces latency for UDP multicast feed (works with OpenOnload)
net.core.busy_poll            = 50
net.core.busy_read            = 50

# Disable TCP timestamps (minor latency reduction, saves 12 bytes per packet)
net.ipv4.tcp_timestamps       = 0

# TCP socket buffer auto-tuning ranges
net.ipv4.tcp_rmem             = 4096 87380 134217728
net.ipv4.tcp_wmem             = 4096 65536 134217728
