syntax = "proto3";

package omm.proto;

// ─── Common types ─────────────────────────────────────────────────────────────

message Greeks {
    uint32 instrument_id = 1;
    double theo_price    = 2;
    double delta         = 3;
    double gamma         = 4;
    double vega          = 5;
    double theta         = 6;
    double rho           = 7;
    double iv            = 8;
    double T             = 9;
    int64  calc_ts_ns    = 10;
    double std_delta     = 11;
    double delta_cash    = 12;
    double std_gamma     = 13;
    double gamma_cash    = 14;
    double vega_cash     = 15;
    double theta_cash    = 16;
    double rho_cash      = 17;
    double vanna         = 18;
    double volga         = 19;
    double charm         = 20;
}

message Position {
    uint32 instrument_id  = 1;
    int32  net_position   = 2;
    double avg_price      = 3;
    double realized_pnl   = 4;
    double unrealized_pnl = 5;
}

message PortfolioGreeks {
    double total_delta = 1;
    double total_gamma = 2;
    double total_vega  = 3;
    double total_theta = 4;
}

message RiskAlert {
    enum AlertType {
        POSITION_BREACH = 0;
        DELTA_BREACH    = 1;
        GAMMA_BREACH    = 2;
        VEGA_BREACH     = 3;
        QUOTE_CANCEL_GIVE_UP = 4;
    }
    AlertType type       = 1;
    string    message    = 2;
    int64     ts_ns      = 3;
}

message Tick {
    uint32 instrument_id  = 1;
    double last_price     = 2;
    double bid_price      = 3;
    double ask_price      = 4;
    int32  bid_volume     = 5;
    int32  ask_volume     = 6;
    int64  exchange_ts_ns = 7;
    int64  recv_ts_ns     = 8;
    repeated double bid_prices  = 9;
    repeated double ask_prices  = 10;
    repeated int32  bid_volumes = 11;
    repeated int32  ask_volumes = 12;
}

message OrderUpdate {
    uint64 client_order_id  = 1;
    uint32 instrument_id    = 2;
    string status           = 3;
    double fill_price       = 4;
    int32  fill_volume      = 5;
    int64  ts_ns            = 6;
    string exchange_id      = 7;
    string side             = 8;
    double price            = 9;
    int32  volume           = 10;
    uint64 exchange_trade_id = 11;
    uint32 book_id          = 12;
}

message QuoteUpdate {
    uint64 client_quote_id = 1;
    uint32 instrument_id   = 2;
    double bid_price       = 3;
    double ask_price       = 4;
    int32  bid_volume      = 5;
    int32  ask_volume      = 6;
    string status          = 7;
    int64  ts_ns           = 8;
    uint32 book_id         = 9;
}

message InstrumentInfo {
    uint32 instrument_id   = 1;
    string code            = 2;
    string underlying_code = 3;
    string kind            = 4;
    string option_type     = 5;
    double strike          = 6;
    uint32 product_index   = 7;
    uint32 underlying_id   = 8;
    string exchange_id     = 9;
    int32  expiry_date     = 10;
    double tick_size       = 11;
    double multiplier      = 12;
}

message UserInfo {
    uint32 user_id = 1;
    string username = 2;
    string display_name = 3;
    bool active = 4;
    uint32 default_book_id = 5;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    bool ok = 1;
    string message = 2;
    string session_token = 3;
    UserInfo user = 4;
}

message LogoutRequest {}

message LogoutResponse {
    bool ok = 1;
    string message = 2;
    bool triggered_shutdown = 3;
}

message WhoAmIRequest {}

message WhoAmIResponse {
    bool ok = 1;
    string message = 2;
    UserInfo user = 3;
}

message BookInfo {
    uint32 book_id = 1;
    string book_code = 2;
    string display_name = 3;
    bool active = 4;
    string description = 5;
}

message BookPosition {
    uint32 book_id = 1;
    uint32 instrument_id = 2;
    uint32 product_index = 3;
    int32 net_position = 4;
    int32 long_position = 5;
    int32 short_position = 6;
    double avg_long_price = 7;
    double avg_short_price = 8;
    double realized_pnl = 9;
}

message BookPortfolio {
    uint32 book_id = 1;
    uint32 product_index = 2;  // 0xFF = aggregate across all products
    double total_delta = 3;
    double total_gamma = 4;
    double total_vega = 5;
    double total_theta = 6;
    double realized_pnl = 7;
    double unrealized_pnl = 8;
    int64 calc_ts_ns = 9;
}

message VolSurfaceSlice {
    double expiry_T = 1;
    repeated double strikes = 2;
    repeated double vols    = 3;
}

message VolSurface {
    uint32 product_index           = 1;
    repeated VolSurfaceSlice slices = 2;
    int64  fit_ts_ns               = 3;
}

// ─── Control request/response ─────────────────────────────────────────────────

message MMParams {
    optional double bid_spread                          = 1;
    optional double ask_spread                          = 2;
    optional double product_delta_threshold             = 3;
    optional int32  quote_volume                        = 4;
    optional int32  max_position                        = 5;
    optional bool   enabled                             = 6;
    optional double product_vega_threshold              = 7;
    optional double min_quote_interval_ms               = 8;
    optional int32  warning_position                    = 9;
    optional double base_half_spread_ticks              = 10;
    optional double min_half_spread_ticks               = 11;
    optional double max_half_spread_ticks               = 12;
    optional double inventory_skew_per_lot_ticks        = 13;
    optional double follow_weight                       = 14;
    optional double requote_price_epsilon_ticks         = 15;
    optional double market_width_widen_threshold_ticks  = 16;
    optional double underlying_move_widen_threshold_ticks = 17;
    optional bool   use_one_sided_at_limits             = 18;
}

message ProductPricingParams {
    uint32 product_index = 1;
    string base_offset_type = 2;  // "tick" | "price" | "percentage"
    double base_offset_value = 3;
}

enum ArbitrageStrategyType {
    ARB_STRATEGY_NONE = 0;
    ARB_STRATEGY_PCP  = 1;
}

message ArbParams {
    optional double min_edge_ticks      = 1;
    optional double cooldown_ms         = 2;
    optional double scan_interval_ms    = 3;
    optional double cleanup_timeout_ms  = 4;
    optional int32  max_order_volume    = 5;
    optional int32  max_live_orders     = 6;
    optional bool   cleanup_on_partial  = 7;
    optional bool   enabled             = 8;
}

message ArbStrategyId {
    uint32 product_index = 1;
    ArbitrageStrategyType strategy_type = 2;
}

message ArbStrategyParamsEntry {
    uint32 product_index = 1;
    ArbitrageStrategyType strategy_type = 2;
    ArbParams params = 3;
}

message SetStrategyParamsRequest {
    uint32   product_index = 1;
    MMParams params        = 2;
}

message SetStrategyParamsResponse {
    bool   ok      = 1;
    string message = 2;
}

message SetProductPricingParamsRequest {
    ProductPricingParams params = 1;
}

message SetProductPricingParamsResponse {
    bool ok = 1;
    string message = 2;
}

message SetArbStrategyParamsRequest {
    ArbStrategyId id = 1;
    ArbParams params = 2;
}

message SetArbStrategyParamsResponse {
    bool   ok      = 1;
    string message = 2;
}

message StartStopRequest {
    int32 product_index = 1;  // -1 = all products
}

message StartStopResponse {
    bool   ok      = 1;
    string message = 2;
}

message ArbStartStopRequest {
    ArbStrategyId id = 1;
}

message ArbStartStopResponse {
    bool   ok      = 1;
    string message = 2;
}

message RiskThreshold {
    double max_net_position = 1;
    double max_delta        = 2;
    double max_gamma        = 3;
    double max_vega         = 4;
}

message RiskState {
    RiskThreshold threshold      = 1;
    bool position_breach         = 2;
    bool delta_breach            = 3;
    bool gamma_breach            = 4;
    bool vega_breach             = 5;
}

enum MMQuoteState {
    MM_QUOTE_IDLE           = 0;
    MM_QUOTE_LIVE           = 1;
    MM_QUOTE_ACK_PENDING    = 2;
    MM_QUOTE_CANCEL_PENDING = 3;
    MM_QUOTE_CANCEL_FAILED  = 4;
    MM_QUOTE_SUPPRESSED     = 5;
}

enum MMSuppressReason {
    MM_REASON_NONE              = 0;
    MM_REASON_DISABLED          = 1;
    MM_REASON_SESSION_CLOSED    = 2;
    MM_REASON_STALE_THEO        = 3;
    MM_REASON_INVALID_MARKET    = 4;
    MM_REASON_POSITION_LIMIT    = 5;
    MM_REASON_RISK_LIMIT        = 6;
    MM_REASON_THROTTLE          = 7;
    MM_REASON_UNDERLYING_SHOCK  = 8;
    MM_REASON_PRODUCT_EXPOSURE  = 9;
    MM_REASON_CANCEL_STUCK      = 10;
}

enum ArbSuppressReason {
    ARB_REASON_NONE               = 0;
    ARB_REASON_DISABLED           = 1;
    ARB_REASON_NO_PAIRS           = 2;
    ARB_REASON_INVALID_MARKET     = 3;
    ARB_REASON_COOLDOWN           = 4;
    ARB_REASON_INTENT_BACKPRESSURE = 5;
    ARB_REASON_LIVE_ORDERS        = 6;
    ARB_REASON_CLEANUP_PENDING    = 7;
}

message ProductMMState {
    uint32 product_index      = 1;
    bool strategy_enabled     = 2;
    bool session_open         = 3;
    bool product_suppressed   = 4;
    repeated MMSuppressReason reasons = 5;
}

message InstrumentMMState {
    uint32 instrument_id      = 1;
    uint32 product_index      = 2;
    MMQuoteState quote_state  = 3;
    repeated MMSuppressReason reasons = 4;
    int32  net_position       = 5;
    uint32 cancel_attempts    = 6;
    int64  last_quote_ts_ns   = 7;
}

message ArbStrategyState {
    uint32 product_index                 = 1;
    ArbitrageStrategyType strategy_type  = 2;
    bool enabled                         = 3;
    bool running                         = 4;
    bool cleanup_active                  = 5;
    uint32 live_orders                   = 6;
    uint32 pair_count                    = 7;
    uint32 active_call_id                = 8;
    uint32 active_put_id                 = 9;
    uint32 active_future_id              = 10;
    repeated ArbSuppressReason reasons   = 11;
    double last_edge_ticks               = 12;
    double last_trigger_edge_ticks       = 13;
    int64  last_eval_ts_ns               = 14;
    int64  last_trigger_ts_ns            = 15;
}

enum PcpOpportunityDirection {
    PCP_DIR_NONE = 0;
    PCP_DIR_LONG_SYNTH_SHORT_FUTURE = 1;
    PCP_DIR_SHORT_SYNTH_LONG_FUTURE = 2;
}

message PcpOpportunityState {
    uint32 product_index                 = 1;
    ArbitrageStrategyType strategy_type  = 2;
    uint32 call_id                       = 3;
    uint32 put_id                        = 4;
    uint32 future_id                     = 5;
    int32  expiry_date                   = 6;
    double strike                        = 7;
    bool   market_valid                  = 8;
    bool   selected                      = 9;
    double discount_factor               = 10;
    double synthetic_bid                 = 11;
    double synthetic_ask                 = 12;
    double future_bid                    = 13;
    double future_ask                    = 14;
    double long_synth_edge_ticks         = 15;
    double short_synth_edge_ticks        = 16;
    double best_edge_ticks               = 17;
    PcpOpportunityDirection best_direction = 18;
    int32  best_volume                   = 19;
    int64  eval_ts_ns                    = 20;
}

message SetRiskThresholdRequest  { RiskThreshold threshold = 1; }
message SetRiskThresholdResponse { bool ok = 1; string message = 2; }

message ManualOrderRequest {
    uint32 instrument_id = 1;
    string side          = 2;  // "buy" | "sell"
    double price         = 3;
    int32  volume        = 4;
    optional uint32 book_id = 5;
    string order_type = 6;      // "GFD" | "FAK" | "FOK"; field 6 was time_condition
    string price_type = 7;      // "Limit" | "Market"
    string volume_condition = 8 [deprecated = true]; // legacy "Any" | "All" fallback
}
message ManualOrderResponse {
    bool ok = 1;
    string message = 2;
    uint64 order_id = 3;
    uint32 book_id = 4;
}

message CancelOrderRequest  { uint64 order_id = 1; uint32 instrument_id = 2; }
message CancelOrderResponse { bool ok = 1; string message = 2; }
message CancelQuoteRequest  { uint64 quote_id = 1; uint32 instrument_id = 2; }
message CancelQuoteResponse { bool ok = 1; string message = 2; }

message SnapshotRequest  {}
message SnapshotResponse {
    repeated Greeks         greeks      = 1;
    repeated Position       positions   = 2;
    PortfolioGreeks         portfolio   = 3;
    repeated MMParams       mm_params   = 4;
    repeated InstrumentInfo instruments = 5;
    RiskState               risk_state  = 6;
    repeated ProductMMState product_states = 7;
    repeated InstrumentMMState instrument_states = 8;
    repeated ArbStrategyParamsEntry arb_params = 9;
    repeated ArbStrategyState arb_strategy_states = 10;
    repeated PcpOpportunityState pcp_opportunities = 11;
    UserInfo current_user = 12;
    repeated BookInfo books = 13;
    repeated BookPosition book_positions = 14;
    repeated BookPortfolio book_portfolios = 15;
    repeated ProductPricingParams product_pricing_params = 16;
}

message StreamRequest { uint32 product_index = 1; }  // 0xFF = all

// ─── Service ──────────────────────────────────────────────────────────────────

service TradingMonitor {
    rpc Login            (LoginRequest)               returns (LoginResponse);
    rpc Logout           (LogoutRequest)              returns (LogoutResponse);
    rpc WhoAmI           (WhoAmIRequest)              returns (WhoAmIResponse);
    // ── Streaming (server → client) ──────────────────────────────────────────
    rpc StreamGreeks     (StreamRequest) returns (stream Greeks);
    rpc StreamPositions  (StreamRequest) returns (stream Position);
    rpc StreamTicks      (StreamRequest) returns (stream Tick);
    rpc StreamOrders     (StreamRequest) returns (stream OrderUpdate);
    rpc StreamTrades     (StreamRequest) returns (stream OrderUpdate);
    rpc StreamQuotes     (StreamRequest) returns (stream QuoteUpdate);
    rpc StreamRiskAlerts (StreamRequest) returns (stream RiskAlert);
    rpc StreamVolSurface (StreamRequest) returns (stream VolSurface);

    // ── Control (client → server, unary) ─────────────────────────────────────
    rpc SetStrategyParams  (SetStrategyParamsRequest)  returns (SetStrategyParamsResponse);
    rpc SetProductPricingParams (SetProductPricingParamsRequest) returns (SetProductPricingParamsResponse);
    rpc StartStrategy      (StartStopRequest)          returns (StartStopResponse);
    rpc StopStrategy       (StartStopRequest)          returns (StartStopResponse);
    rpc SetArbStrategyParams (SetArbStrategyParamsRequest) returns (SetArbStrategyParamsResponse);
    rpc StartArbStrategy     (ArbStartStopRequest)        returns (ArbStartStopResponse);
    rpc StopArbStrategy      (ArbStartStopRequest)        returns (ArbStartStopResponse);
    rpc SetRiskThreshold   (SetRiskThresholdRequest)   returns (SetRiskThresholdResponse);
    rpc SendManualOrder    (ManualOrderRequest)         returns (ManualOrderResponse);
    rpc CancelOrder        (CancelOrderRequest)        returns (CancelOrderResponse);
    rpc CancelQuote        (CancelQuoteRequest)        returns (CancelQuoteResponse);
    rpc GetSnapshot        (SnapshotRequest)           returns (SnapshotResponse);
}
